[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["static/", "data/", "logs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]   # LOCKED families (D-15) — no ALL, no preview
# Codes ignored because they conflict with the codebase's DOCUMENTED, idiomatic
# patterns (CLAUDE.md / CONVENTIONS.md) — not a rule-family change, the E/B/F/W
# families stay selected. Auto-"fixing" these would change behavior or fight the
# framework, which violates the behavior-preserving mandate:
#   E501  — no hard-column convention (D-19); formatter wraps, lint must not fail length
#   E402  — module-level-import-not-at-top: lazy/local + post-setup imports are an
#           established convention (CLAUDE.md "established convention, not an accident";
#           app.py orchestrator imports routers after app construction)
#   B904   — raise-without-from-inside-except: the "degrade-gracefully" error style
#           re-raises/returns structured errors without `from e` pervasively
#   E712   — `== True` / `== False`: required SQLAlchemy filter idiom (Column == True
#           builds SQL; `is True` breaks query construction)
#   E711   — `== None`: required SQLAlchemy `IS NULL` filter idiom
#   B008   — function-call-in-default-argument: FastAPI's Form(...)/Depends(...)/
#           Query(...) default-argument idiom (CLAUDE.md notes Form(...) usage)
ignore = ["E501", "E402", "B904", "E712", "E711", "B008"]

[tool.ruff.lint.per-file-ignores]
# src/database.py is a pure re-export shim (`from core.database import *` plus an
# explicit name list "for IDE/type-checker visibility"). It has no `__all__`, so
# F401 would delete the explicit re-exports and break `from src.database import X`
# used across the codebase (circular-import-sensitive tool chain). Suppress F401/F403
# here to preserve the documented re-export pattern (CONVENTIONS.md barrel convention).
"src/database.py" = ["F401", "F403"]
# Tests deliberately import modules for their import-time side effects (e.g.
# `import src.agent_tools` to prime the module cache and break a runtime circular
# import before `from src.tool_parsing import ...`), and import private helpers /
# re-use fixture names. F401 would strip those side-effect imports and silently
# break collection; F811 fires on intentional fixture/name redefinition. Suppress
# both for the test tree (plan Task 4 recommendation; preserves behavior).
"tests/**" = ["F401", "F811"]
# Residual findings the safe auto-fix could not resolve, suppressed at config level
# (greppable, no code churn, no behavior change). Each is a localized minor lint that
# would require a logic edit to "fix" — out of scope for a behavior-preserving pass
# (plan Task 4: prefer config-level per-file-ignores; no rule-family change).
"core/__init__.py" = ["F403"]
"mcp_servers/email_server.py" = ["F841"]
"routes/cookbook_routes.py" = ["E741"]
"routes/document_routes.py" = ["B023", "E731"]
"routes/gallery_routes.py" = ["B007"]
"routes/memory_routes.py" = ["E741"]
"routes/model_routes.py" = ["B905", "F841"]
"routes/upload_routes.py" = ["B007"]
"scripts/diffusion_server.py" = ["F841"]
"scripts/update_database.py" = ["W291"]
"src/agent_loop.py" = ["B007", "B023"]
"src/caldav_sync.py" = ["B018"]
"src/chat_processor.py" = ["B905"]
"src/document_actions.py" = ["B007", "F841"]
"src/email_thread_parser.py" = ["E741"]
"src/personal_docs.py" = ["B007", "W291"]
"src/preset_manager.py" = ["W291"]
"src/task_scheduler.py" = ["B006", "B023"]
"src/teacher_escalation.py" = ["B007"]
"src/upload_handler.py" = ["B007"]
"src/visual_report.py" = ["B905"]
"tests/test_auth_require_privilege_nondict.py" = ["B017"]
"tests/test_deep_research_extraction_controls.py" = ["B026"]
"tests/test_digest_windows.py" = ["B905"]
"tests/test_hwfit_amd.py" = ["B011"]
"tests/test_rag_remove_directory_scope.py" = ["B905"]
"tests/test_skills_manager_owner_isolation.py" = ["F841"]
"tests/test_upload_handler_atomicity.py" = ["F841"]

[tool.ruff.format]
quote-style = "double"                     # matches house style (CONVENTIONS.md)

[tool.mypy]
# Inverted (per-module) strictness (D-17): a LENIENT global baseline that passes
# with zero errors on day 1. No global `strict = true` (SC#5). Modules are tightened
# later (Phase 3) by adding targeted per-module overrides — the tighten-list is
# intentionally EMPTY at baseline.
python_version = "3.12"
# Project root is on sys.path; modules are imported as top-level packages (`src.`,
# `routes.`, `services.`, `core.`) per CLAUDE.md. `src/` has no `__init__.py`, so
# without an explicit namespace base mypy maps `src/auth_helpers.py` to BOTH
# `auth_helpers` and `src.auth_helpers` ("found twice under different module names").
# `explicit_package_bases` + `mypy_path = "."` anchors the repo root as the single
# namespace base, matching the runtime import convention (Rule 3 blocking fix).
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true              # untyped 3rd-party stubs missing — don't fail
check_untyped_defs = false                 # lenient global, zero errors day 1 (D-17)
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
no_implicit_optional = false
warn_redundant_casts = true
# NOTE on `warn_unused_ignores`: deliberately NOT enabled at baseline. The codebase
# uses `name = None  # type: ignore` optional-import guards pervasively (graceful
# degradation, CLAUDE.md); with `ignore_missing_imports = true` mypy reports those as
# "unused", which would force application-source edits on a config-only plan. Re-enable
# in Phase 3 after the ignores are audited (RATCHET-03-A; T-03-02 mitigation deferred).
# warn_unused_ignores = true
#
# Idiom-driven error categories disabled at baseline (D-17 lenient day-1 zero). These
# fire almost entirely from two DOCUMENTED framework idioms, exactly analogous to how
# Plan 01-02 suppressed ruff's idiom conflicts at config level (no source churn, no
# behavior change): (1) SQLAlchemy instance attribute access typed as `Column[T]`
# (mypy has no SQLAlchemy plugin enabled, so ORM column reads look like Column objects),
# and (2) FastAPI `Form(...)`/`UploadFile | str` default-argument unions. Genuinely-new
# type errors in NEW code surface via the remaining enabled codes; these are tightened
# per-module in Phase 3 (RATCHET-03-B), not globally relaxed forever.
disable_error_code = [
    "assignment", "arg-type", "attr-defined", "union-attr", "var-annotated",
    "misc", "valid-type", "index", "return-value", "operator", "call-overload",
    "dict-item", "list-item", "type-var", "return", "no-redef", "method-assign",
    "has-type", "truthy-function",
]
exclude = ["^static/", "^tests/", "^scripts/"]  # tests heavily stubbed — exclude day 1 (Open Q2)

[[tool.mypy.overrides]]
# Known untyped third parties — explicit/greppable even though `ignore_missing_imports`
# above already covers them. Documents WHICH deps lack type stubs.
module = ["mcp.*", "chromadb.*", "fastembed.*", "caldav.*", "icalendar.*",
          "croniter.*", "qrcode.*", "pyotp.*", "fitz.*", "markitdown.*",
          "duckduckgo_search.*", "faster_whisper.*", "youtube_transcript_api.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["."]
# concurrency is intentionally LEFT COMMENTED: Plan 01-01's `pytest --cov=.` stability
# run inside python:3.12-slim was deterministic with NO async-coverage flakiness
# (Pitfall 11 cleared, 01-01-SUMMARY). Only add `concurrency = ["greenlet", "thread"]`
# if a later coverage run flakes. Consumed by Plan 04 (scorecard / coverage metric).
# concurrency = ["greenlet", "thread"]

[tool.bandit]
# Security-scan config skeleton consumed by Plan 05's CI bandit job. `skips` is
# deliberately EMPTY at baseline (T-03-03): the documented suppressions are populated
# in Plan 05 AFTER the audit pass. THREAT_MODEL.md treats shell/file/email subprocess
# as INTENTIONAL admin features, so B602–B607 will fire heavily and must be triaged
# per-finding with rationale — never blanket-disabled here.
exclude_dirs = ["tests", "static", "data", "logs"]
# Documented per-code suppressions from the Plan 05 audit pass (bandit 1.9.4, run in
# python:3.12-slim against `app.py src routes core mcp_servers companion services`).
# The audit found 319 findings, ZERO high-severity (29 MEDIUM, 290 LOW). Each code below
# is triaged with a rationale; the full per-finding classification is recorded in
# .planning/scorecard/security-triage.md. This is NOT a blanket disable — only the codes
# whose findings are entirely intentional admin features (THREAT_MODEL.md) or verified
# false positives are skipped, and any future HIGH-severity finding (B602 etc.) still fires.
skips = [
    # --- subprocess / shell: INTENTIONAL admin features (THREAT_MODEL.md treats the shell
    #     tool, cookbook model-runner scripts, and builtin actions as deliberately-provided,
    #     auth-gated admin capabilities — not an injection bug). All LOW/MEDIUM, no HIGH. ---
    "B404",  # import subprocess — required by the shell tool / cookbook / builtin actions
    "B603",  # subprocess_without_shell_equals_true — admin shell/runner invocations (12, LOW)
    "B604",  # shell=True in builtin_actions admin shell tool (4, MEDIUM/LOW conf) — by design
    "B607",  # start_process_with_partial_path — relies on PATH for admin runner tools (3, LOW)
    # --- degrade-gracefully convention (CLAUDE.md): broad try/except that intentionally
    #     swallows to keep optional subsystems alive. House style, not a hidden-error smell. ---
    "B110",  # try_except_pass (224, LOW) — graceful-degradation idiom, pervasive
    "B112",  # try_except_continue (33, LOW) — same idiom inside loops
    # --- false positives / non-security contexts ---
    "B104",  # hardcoded_bind_all_interfaces (8, MEDIUM) — these are LLM host/URL string
             #   defaults ("0.0.0.0" in model-host config), NOT real socket binds; the app
             #   binds loopback by default (CLAUDE.md: "loopback-bound by default for safety")
    "B105",  # hardcoded_password_string (7, LOW) — verified false positives: OAuth token
             #   URLs, numeric setting defaults ("6000"/"200000"), and a shell snippet string
    "B108",  # hardcoded_tmp_directory (3, MEDIUM) — tool_execution sandbox scratch paths, intentional
    "B311",  # random — non-crypto pseudo-random for gallery/compare display IDs (2, LOW), not tokens
    "B103",  # set_bad_file_permissions (2, MEDIUM) — chmod 0o755 makes cookbook runner scripts
             #   executable; the files are generated runner shims, executability is required
    "B608",  # hardcoded_sql_expressions (12, MEDIUM) — verified parameterized: user values use
             #   bound `?` params; f-string interpolation is only computed `?,?` placeholder
             #   counts or internal allow-listed table names, never untrusted input
]
