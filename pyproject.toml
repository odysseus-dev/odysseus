[project]
name = "odysseus"
version = "0.1.0"
description = "Odysseus AI companion management server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "python-dotenv",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "SQLAlchemy",
    "pypdf",
    "beautifulsoup4",
    "charset-normalizer",
    "numpy",
    "chromadb-client",
    "fastembed",
    "youtube-transcript-api",
    "markdown",
    "icalendar",
    "caldav",
    "cryptography",
    "bcrypt",
    "mcp",
    "pyotp",
    "qrcode[pil]",
    "croniter",
    "psutil",
    "py-cpuinfo",
]

[project.optional-dependencies]
optional = [
    "duckduckgo-search",
    "PyMuPDF",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
