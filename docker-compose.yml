services:
  odysseus:
    build: .
    ports:
      - "${APP_PORT:-7000}:7000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # Cookbook remote-server SSH identity. Odysseus can generate a key here;
      # add the shown public key to each remote server's authorized_keys.
      - ./data/ssh:/app/.ssh
      # Cookbook local model cache. Inside Docker, "Local" means the Odysseus
      # container, so persist its HuggingFace cache under ./data/huggingface.
      - ./data/huggingface:/app/.cache/huggingface
      # Cookbook-installed Python CLIs/packages (vLLM, llama-cpp-python, etc.)
      # land under /app/.local for the odysseus user. Persist them so a
      # container recreate does not silently remove installed serve engines.
      - ./data/local:/app/.local
    extra_hosts:
      # Lets the container reach local services on the Docker host, including
      # Ollama at http://host.docker.internal:11434.
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - SEARXNG_INSTANCE=http://searxng:8080
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      # PUID / PGID — the user/group the container drops to before
      # running uvicorn (entrypoint also chowns /app/data + /app/logs
      # to match, so bind-mounted files stay editable from the host).
      # 1000 is the default first user on most Linux installs. If your
      # host user has a different id, override here or via .env, e.g.:
      #   PUID=1001
      #   PGID=1001
      # Find yours with:  id -u  /  id -g
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    # GPU passthrough — requires nvidia-container-toolkit on host.
    # Uncomment the deploy section below to enable GPU access inside the
    # container (for local model serving via Cookbook/vLLM/llama.cpp).
    # Ollama runs on the host and is already reachable via
    # host.docker.internal:11434 without GPU passthrough.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      searxng:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    restart: unless-stopped

  chromadb:
    image: docker.io/chromadb/chroma:latest
    ports:
      - "${CHROMADB_BIND:-127.0.0.1}:8100:8000"
    volumes:
      - chromadb-data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  searxng:
    image: docker.io/searxng/searxng:latest
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ ! -s /etc/searxng/settings.yml ] || grep -q 'odysseus-local-searxng-json-2026-05-30\|__SEARXNG_SECRET__' /etc/searxng/settings.yml; then
          secret="$${SEARXNG_SECRET:-}"
          if [ -z "$$secret" ]; then
            secret="$$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          fi
          sed "s|__SEARXNG_SECRET__|$$secret|g" /tmp/searxng-settings.yml.template > /etc/searxng/settings.yml
        fi
        exec /usr/local/searxng/entrypoint.sh
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - searxng-data:/etc/searxng
      - ./config/searxng/settings.yml:/tmp/searxng-settings.yml.template:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5).read(1)\""]
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  ntfy:
    image: docker.io/binwiederhier/ntfy
    command: serve
    ports:
      - "${NTFY_BIND:-127.0.0.1}:8091:80"
    volumes:
      - ntfy-cache:/var/cache/ntfy
    environment:
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://localhost:8091}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  nexus-cost:
    build: ./nexus-cost
    ports:
      - "127.0.0.1:8199:8199"
    volumes:
      - nexus-cost-data:/data
      - ./nexus-cost/config.yaml:/app/config.yaml:ro
    environment:
      - NEXUS_COST_DB_PATH=/data/costs.db
      - NEXUS_COST_CONFIG_PATH=/app/config.yaml
      - NEXUS_COST_API_KEY=${NEXUS_COST_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8199/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  nexus-metrics:
    build: ./nexus-metrics
    network_mode: host
    pid: host
    privileged: true
    volumes:
      - ./nexus-metrics/config.yaml:/app/config.yaml:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  nexus-news:
    build: ./nexus-news
    ports:
      - "127.0.0.1:8101:8100"
    volumes:
      - nexus-news-data:/app/data
      - ./nexus-news/config.yaml:/app/config.yaml:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  nexus-gateway:
    build: /home/donn/nexus-gateway
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - nexus-gateway-data:/data
    environment:
      - NEXUS_GATEWAY_CONFIG=/data/config.yaml
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  nexus-memory:
    build: /home/donn/nexus-memory
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - nexus-memory-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  nexus-workflows:
    build: /home/donn/nexus-workflows
    ports:
      - "127.0.0.1:7800:7800"
    volumes:
      - nexus-workflows-data:/data
    environment:
      - NEXUS_WORKFLOWS_DB=/data/workflows.db
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7800/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  nexus-weather:
    build: /home/donn/nexus-weather
    ports:
      - "127.0.0.1:8085:8080"
    volumes:
      - ./nexus-weather/config.yaml:/app/config.yaml:ro
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  nexus-automation:
    build: /home/donn/nexus-automation
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - nexus-automation-data:/app/data
      - ./nexus-automation/config.json:/app/config.json:ro
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - ntfy
    restart: unless-stopped

  nexus-security:
    build: /home/donn/nexus-security
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - nexus-security-data:/app/data
      - /var/log:/var/log:ro
    environment:
      - PYTHONUNBUFFERED=1
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  nexus-monitor:
    build: /home/donn/code/nexus-monitor
    ports:
      - "127.0.0.1:8099:8099"
    volumes:
      - nexus-monitor-data:/data
    environment:
      - NEXUS_MONITOR_CONFIG=/data/config.yaml
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8099/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  nexus-secrets:
    build: /home/donn/code/nexus-secrets
    ports:
      - "127.0.0.1:7438:7438"
    volumes:
      - nexus-secrets-data:/data
    environment:
      - NEXUS_SECRETS_DB=/data/secrets.db
      - NEXUS_SECRETS_KEY_FILE=/data/key
    restart: unless-stopped

  duinn-media:
    build: /home/donn/duinn-media
    ports:
      - "127.0.0.1:8096:8080"
    volumes:
      - duinn-media-data:/data
      - /home/donn/media:/media
    environment:
      - DUINN_MEDIA_DATA=/data
    restart: unless-stopped

  nexus-backup:
    build: /home/donn/code/nexus-backup
    volumes:
      - nexus-backup-data:/backups
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/donn:/source/home:ro
    environment:
      - NEXUS_BACKUP_DIR=/backups
      - NEXUS_BACKUP_SCHEDULE=0 3 * * *
    restart: unless-stopped

  mcp-bridge:
    build:
      context: .
      dockerfile: Dockerfile.mcp-bridge
    ports:
      - "127.0.0.1:8378:8378"
    volumes:
      - ./data/tech_duinn:/app/data/tech_duinn
    environment:
      - MCP_BRIDGE_TOKEN=${MCP_BRIDGE_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8378/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  searxng-data:
  chromadb-data:
  ntfy-cache:
  nexus-cost-data:
  nexus-news-data:
  nexus-gateway-data:
  nexus-memory-data:
  nexus-workflows-data:
  nexus-automation-data:
  nexus-security-data:
  nexus-monitor-data:
  nexus-secrets-data:
  duinn-media-data:
  nexus-backup-data:
