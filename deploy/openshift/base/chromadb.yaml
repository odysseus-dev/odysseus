apiVersion: apps/v1
kind: Deployment
metadata:
  name: odysseus-chromadb
  labels:
    app.kubernetes.io/name: odysseus-chromadb
    app.kubernetes.io/part-of: odysseus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: odysseus-chromadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: odysseus-chromadb
        app.kubernetes.io/part-of: odysseus
    spec:
      serviceAccountName: odysseus
      containers:
        - name: chromadb
          image: image-registry.openshift-image-registry.svc:5000/odysseus/odysseus-chromadb:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          volumeMounts:
            - name: chromadb-data
              mountPath: /chroma
          readinessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: chromadb-data
          persistentVolumeClaim:
            claimName: odysseus-chromadb-data
---
apiVersion: v1
kind: Service
metadata:
  name: odysseus-chromadb
  labels:
    app.kubernetes.io/name: odysseus-chromadb
    app.kubernetes.io/part-of: odysseus
spec:
  selector:
    app.kubernetes.io/name: odysseus-chromadb
  ports:
    - name: http
      port: 8000
      targetPort: 8000
