apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: odysseus-data
  labels:
    app.kubernetes.io/name: odysseus
    app.kubernetes.io/part-of: odysseus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: odysseus-logs
  labels:
    app.kubernetes.io/name: odysseus
    app.kubernetes.io/part-of: odysseus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: odysseus-chromadb-data
  labels:
    app.kubernetes.io/name: odysseus-chromadb
    app.kubernetes.io/part-of: odysseus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
