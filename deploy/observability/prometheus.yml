# Prometheus scrape config for the overlay.
# otel-collector:8889 is the Collector prometheus exporter (overlay DNS).
# odysseus:7000 exists when this file is composed with docker-compose.yml.
# A scrape error while Odysseus is down is expected; this task does not
# add the /metrics handler.

global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: odysseus
    metrics_path: /metrics
    static_configs:
      - targets: ["odysseus:7000"]
