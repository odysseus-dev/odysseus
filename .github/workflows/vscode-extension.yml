name: vscode-extension

# Typecheck, lint, test, build, and package the VS Code extension on any change
# under integrations/vscode-extension/. Keeps the editor integration green
# independently of the Python app's CI.

on:
  push:
    branches: [dev, main]
    paths:
      - "integrations/vscode-extension/**"
      - ".github/workflows/vscode-extension.yml"
  pull_request:
    paths:
      - "integrations/vscode-extension/**"
      - ".github/workflows/vscode-extension.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: integrations/vscode-extension

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --out odysseus-vscode-extension.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: odysseus-vscode-extension
          path: integrations/vscode-extension/odysseus-vscode-extension.vsix
          if-no-files-found: error
