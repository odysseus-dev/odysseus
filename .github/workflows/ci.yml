name: CI

on:
  workflow_call:
    inputs:
      skip_detect:
        description: Use the `run` input instead of running path detection
        type: boolean
        default: false
      run:
        description: Run checks (true/false); used when skip_detect is true
        type: string
        default: 'false'
      require_scope:
        description: Fail when the app is not in scope (for deploy/build workflows)
        type: boolean
        default: false
    outputs:
      changed:
        description: App was in CI scope
        value: ${{ jobs.resolve-scope.outputs.changed }}
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    if: github.event_name == 'workflow_call' && !inputs.skip_detect
    uses: ./.github/workflows/detect-changes.yaml

  resolve-scope:
    needs: detect-changes
    if: >-
      always()
      && (needs.detect-changes.result == 'success' || needs.detect-changes.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
    steps:
      - name: Resolve CI scope
        id: scope
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" != "workflow_call" ]]; then
            changed=true
          elif [[ "${{ inputs.skip_detect }}" == "true" ]]; then
            changed="${{ inputs.run }}"
          else
            changed="${{ needs.detect-changes.outputs.changed }}"
          fi

          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

      - name: Require app in scope
        if: inputs.require_scope == true
        env:
          CHANGED: ${{ steps.scope.outputs.changed }}
        run: |
          set -euo pipefail
          if [[ "$CHANGED" != "true" ]]; then
            echo "::error::No app or build-related changes detected for this changeset."
            exit 1
          fi

  no-changes:
    needs: resolve-scope
    if: >-
      needs.resolve-scope.result == 'success'
      && needs.resolve-scope.outputs.changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip checks
        run: echo "No app or docker changes detected. Checks skipped."

  python-syntax:
    name: Python syntax (compileall)
    needs: resolve-scope
    if: needs.resolve-scope.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q app.py core routes src services scripts tests

  node-syntax:
    name: JS syntax (node --check)
    needs: resolve-scope
    if: needs.resolve-scope.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node --check
        run: |
          shopt -s globstar nullglob
          for f in static/app.js static/js/**/*.js; do
            node --check "$f"
          done

  python-tests:
    name: Python tests (pytest)
    needs: resolve-scope
    if: needs.resolve-scope.outputs.changed == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: mkdir -p data
      - run: python -m pytest -q
