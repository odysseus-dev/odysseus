name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Least privilege: none of the jobs write to the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-test-guidance:
    name: Focused test guidance (report-only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Report changed test paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          report_file="$RUNNER_TEMP/focused-test-guidance.md"
          publish_report() {
            cat "$report_file"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              cat "$report_file" >> "$GITHUB_STEP_SUMMARY" || true
            fi
            return 0
          }

          report_unavailable() {
            {
              printf '%s\n\n' '## Focused test guidance unavailable (report-only)'
              printf '%s\n\n' "$1"
              printf '%s\n' 'Existing blocking CI remains the source of truth.'
            } > "$report_file"
            publish_report
            exit 0
          }

          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            report_unavailable "Pull request base/head metadata is missing."
          fi

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            report_unavailable "The pull request base commit is unavailable locally."
          fi

          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            report_unavailable "The pull request head commit is unavailable locally."
          fi

          if ! python3 .github/scripts/focused_test_guidance.py \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" > "$report_file"; then
            report_unavailable "The focused test guidance helper could not produce a report."
          fi

          publish_report

  python-syntax:
    name: Python syntax (compileall)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      # Byte-compile sources — catches syntax errors without installing deps.
      - run: python -m compileall -q app.py core routes src services scripts tests
      - name: Check committed frontend deployment modules
        run: python scripts/build_frontend.py --check

  node-syntax:
    name: JS syntax (node --check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22.23.4"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check frontend architecture
        run: node scripts/check_frontend.mjs
      - name: Check document references and exports
        run: node scripts/check_document_references.mjs
      # Syntax-check our own JS (skip vendored libs in static/lib).
      - name: node --check
        run: |
          shopt -s globstar nullglob
          for f in static/app.js static/js/**/*.js frontend/src/**/*.js; do
            node --check "$f"
          done
          node --check scripts/check_frontend.mjs
          node --check scripts/check_document_references.mjs
      - name: Test frontend architecture gates and reference checks
        run: node --test tests/frontendArchitecture.test.mjs tests/documentReferences.test.mjs
      - name: Test document file processing
        run: node --experimental-vm-modules --test tests/documentFileProcessing.test.mjs
      - name: Test document behavior suites
        run: |
          node --test tests/domainModules.test.mjs \
            tests/documentBehaviorRunner.test.mjs \
            tests/documentPersistence.test.mjs \
            tests/documentActions.test.mjs \
            tests/documentUpdate.test.mjs \
            tests/documentStatus.test.mjs \
            tests/documentVersionHistory.test.mjs \
            tests/markdownImages.test.mjs \
            tests/documentTabBar.test.mjs \
            tests/selectionHighlights.test.mjs \
            tests/documentLiveStream.test.mjs \
            tests/documentToolbar.test.mjs \
            tests/documentOverflow.test.mjs \
            tests/documentFlows.test.mjs

  python-tests:
    name: Python tests (pytest ${{ matrix.shard }})
    # Keep the namespace/AppArmor setup tied to the audited Ubuntu release.
    runs-on: ubuntu-24.04
    # The slowest healthy shard takes ~15 min. Without a cap a stuck step runs
    # until GitHub's 6 h default; with one it is a red shard you can re-run.
    timeout-minutes: 30
    env:
      APT_PACKAGES: ffmpeg bubblewrap ca-certificates
    # Make Python test validation authoritative for the configured scope.
    strategy:
      # Report every failing section in one run instead of cancelling the rest
      # the moment one shard goes red.
      fail-fast: false
      matrix:
        # Shards partition the suite by test file, so the matrix runs every
        # test exactly once. tests/_shards.py owns the partition and
        # tests/test_shards.py pins this list to its DEFAULT_SHARD_COUNT.
        shard: ["1/6", "2/6", "3/6", "4/6", "5/6", "6/6"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Detect whether this PR only touches repository prose outside the Pages site.
      # If so, skip the expensive pytest run while still reporting a passing check.
      - name: Check for docs-only changes
        id: docs-check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          # Keep website/ and assets/branding/ out of this bypass: pytest owns
          # regression guards for their published-file and orphan-asset contracts.
          changed=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          non_docs=$(echo "$changed" | grep -Ev '^(docs/|[^/]+\.md$|\.github/[^/]+\.md$)' || true)
          if [ -z "$non_docs" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Docs-only change detected — skipping pytest."
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute shard identifier
        if: steps.docs-check.outputs.docs_only != 'true'
        id: shard-id
        env:
          SHARD: ${{ matrix.shard }}
        run: printf 'tag=%s\n' "$SHARD" | tr '/' '-' >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: steps.docs-check.outputs.docs_only != 'true'
        with:
          python-version: "3.11"
      # Establish system trust before dependency installers or their hooks run.
      # Keep one apt pass for FFmpeg and bubblewrap; containment is checked later.
      # The ubuntu-24.04 image ships neither tool, so this pass runs on every
      # shard. The regional mirror sometimes trickles at ~100 kB/s instead of
      # failing (10+ min, once 3 h+), which apt's idle timeouts never catch.
      # Cache the .deb files per runner image so the mirror is only hit on a
      # miss, and bound the miss path so a slow mirror falls back or fails.
      - name: Compute apt package cache key
        if: steps.docs-check.outputs.docs_only != 'true'
        id: apt-key
        # ImageOS/ImageVersion change with every runner image update, so the
        # cached set always matches the libraries the image already has.
        run: |
          packages_hash=$(printf '%s' "$APT_PACKAGES" | sha256sum | cut -c1-16)
          printf 'key=apt-debs-v1-%s-%s-%s-%s\n' "$RUNNER_OS" "${ImageOS:-unknown}" "${ImageVersion:-unknown}" "$packages_hash" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: steps.docs-check.outputs.docs_only != 'true'
        id: apt-cache
        with:
          path: ~/.cache/ci-apt-debs
          key: ${{ steps.apt-key.outputs.key }}
      - name: Install FFmpeg and bubblewrap and validate system CA trust
        if: steps.docs-check.outputs.docs_only != 'true'
        id: apt-install
        timeout-minutes: 8
        env:
          CACHE_HIT: ${{ steps.apt-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          debs="$HOME/.cache/ci-apt-debs"
          # A cache missing a top-level package (bubblewrap, say) still installs
          # cleanly, so check the result rather than apt's exit code.
          apt_ready() {
            ffmpeg -version >/dev/null 2>&1 &&
              bwrap --version >/dev/null 2>&1 &&
              [ "$(dpkg-query -W -f='${db:Status-Status}' ca-certificates 2>/dev/null)" = "installed" ]
          }
          if ! apt_ready; then
            installed=false
            if [ "$CACHE_HIT" = "true" ]; then
              # The cache holds every package this image lacks: no apt-get
              # update and no mirror traffic on this path. apt checks the whole
              # set before unpacking, so an incomplete cache fails cleanly here.
              if sudo apt-get install -y --no-download --no-install-recommends \
                -o Dir::Cache::archives="$debs" "$debs"/*.deb && apt_ready; then
                installed=true
              else
                echo "::warning::Cached .deb set did not install cleanly or is incomplete; downloading instead."
              fi
            fi
            if [ "$installed" != "true" ]; then
              # Ensure acquire retries and timeouts are bounded so stalled pool mirrors
              # fail over to Canonical's fallback mirror in seconds rather than hanging.
              # Written to zzz-ci-retries so it sorts after upstream runner configuration.
              printf '%s\n' \
                'Acquire::Retries "1";' \
                'Acquire::http::Timeout "15";' \
                'Acquire::https::Timeout "15";' | sudo tee /etc/apt/apt.conf.d/zzz-ci-retries > /dev/null
              mkdir -p "$debs/partial"
              # Idle timeouts do not fire on a slow trickle, so bound wall time.
              # shellcheck disable=SC2086  # APT_PACKAGES is a word list
              download() {
                timeout 60 sudo apt-get update &&
                  timeout 150 sudo apt-get install -y --download-only --no-install-recommends \
                    -o Dir::Cache::archives="$debs" $APT_PACKAGES
              }
              if ! download; then
                echo "::warning::apt download from the runner mirror failed or was too slow; retrying against archive.ubuntu.com."
                echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
                download
              fi
              # shellcheck disable=SC2086
              sudo apt-get install -y --no-download --no-install-recommends \
                -o Dir::Cache::archives="$debs" $APT_PACKAGES
              if ! apt_ready; then
                echo "::error::ffmpeg, bwrap or ca-certificates is still missing after the apt install."
                exit 1
              fi
              sudo rm -rf "$debs/partial" "$debs/lock"
              sudo chown -R "$(id -u):$(id -g)" "$debs"
              echo "save=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          python scripts/check_ca_trust.py --system
          command -v ffmpeg
          ffmpeg -version | head -n 1
      # Save right after the download, not in a post step, so the set is cached
      # even when the shard's tests fail. Concurrent shards race on the same key;
      # the losers only log a warning.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: steps.docs-check.outputs.docs_only != 'true' && steps.apt-install.outputs.save == 'true'
        with:
          path: ~/.cache/ci-apt-debs
          key: ${{ steps.apt-key.outputs.key }}

      # uv resolves the same versions as pip but installs ~5x faster, and its
      # cache keeps each shard from re-downloading the whole requirement set.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        if: steps.docs-check.outputs.docs_only != 'true'
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"
          prune-cache: false
      - run: |
          uv pip install --system --require-hashes --only-binary=:all: --no-deps -r requirements-bootstrap.txt
          python scripts/check_ca_trust.py --python
          uv pip install --system -r requirements.txt
          uv pip install --system "playwright==1.62.0"
        if: steps.docs-check.outputs.docs_only != 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        if: steps.docs-check.outputs.docs_only != 'true'
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm ci
        if: steps.docs-check.outputs.docs_only != 'true'
      # Browser binaries are keyed on the lockfile's Playwright version.
      # Ubuntu 24.04 runner images already provide all required Chromium system
      # libraries; installing chromium directly skips redundant apt passes and
      # completes in <1s on cache hits.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: steps.docs-check.outputs.docs_only != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium and verify launch
        if: steps.docs-check.outputs.docs_only != 'true'
        run: |
          npx playwright install chromium
          node -e "const { chromium } = require('playwright'); (async () => { const b = await chromium.launch(); await b.close(); })()"
          python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(); b.close(); p.stop()"
      - run: mkdir -p data  # sqlite DB lives at ./data/app.db
        if: steps.docs-check.outputs.docs_only != 'true'
      - name: Validate Python and system CA trust
        if: steps.docs-check.outputs.docs_only != 'true'
        run: python scripts/check_ca_trust.py --system --python

      - name: Establish functional bubblewrap containment
        if: steps.docs-check.outputs.docs_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bwrap --version
          sysctl kernel.unprivileged_userns_clone user.max_user_namespaces \
            kernel.apparmor_restrict_unprivileged_userns
          if [ "$(sysctl -n kernel.unprivileged_userns_clone)" != 1 ] || \
             [ "$(sysctl -n user.max_user_namespaces)" -eq 0 ]; then
            echo '::error::The pytest runner must allow unprivileged user namespaces; kernel namespace support is disabled.'
            exit 1
          fi

          # Match containment._bwrap_available(): PID and mount namespaces,
          # including fresh proc/dev mounts, as the unprivileged runner user.
          bwrap_probe() {
            timeout 3s bwrap --die-with-parent --unshare-pid --ro-bind / / \
              --proc /proc --dev /dev /bin/true
          }

          if ! bwrap_probe && [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1 ]; then
            # Ubuntu 24.04 restricts userns for unconfined applications. Allow
            # only the distro bwrap entry point on this ephemeral pytest VM;
            # retain the global restriction and all unrelated AppArmor policy.
            sudo tee /etc/apparmor.d/odysseus-ci-bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile odysseus-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
            sudo apparmor_parser -r /etc/apparmor.d/odysseus-ci-bwrap
          fi

          if ! bwrap_probe; then
            echo '::error::Functional bubblewrap PID/mount namespaces are required for pytest; containment setup failed.'
            exit 1
          fi
          # Also gate on the runtime probe so a future requirements change
          # cannot silently leave this job without real containment coverage.
          python - <<'PY'
          from src import containment
          if not containment._bwrap_available():
              raise SystemExit("::error::Runtime bubblewrap functionality probe failed; pytest must not start.")
          print("Runtime bubblewrap PID/mount namespace probe passed.")
          PY

      - name: pytest (shard ${{ matrix.shard }})
        id: pytest
        if: steps.docs-check.outputs.docs_only != 'true'
        env:
          PYTEST_SHARD: ${{ matrix.shard }}
          PYTEST_COLLECTION_EXPORT: ${{ runner.temp }}/pytest-collection.json
        run: |
          python -m pytest -q -rs --durations=25 --shard "$PYTEST_SHARD" \
            --junitxml="$RUNNER_TEMP/pytest-report.xml" \
            -o junit_duration_report=total

      - name: Record shard metadata sidecar
        if: always() && steps.docs-check.outputs.docs_only != 'true'
        env:
          SHARD: ${{ matrix.shard }}
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          runner_temp = Path(os.environ.get("RUNNER_TEMP", "."))
          inv_file = runner_temp / "pytest-collection.json"
          collected_files = None
          selected_files = None
          selected_test_counts = None
          selected_test_names = None
          collection_error = None

          if inv_file.is_file():
              try:
                  parsed = json.loads(inv_file.read_text(encoding="utf-8"))
                  if isinstance(parsed, dict):
                      cf = parsed.get("collected_files")
                      sf = parsed.get("selected_files")
                      stc = parsed.get("selected_test_counts")
                      stn = parsed.get("selected_test_names")
                      if (
                          isinstance(cf, list) and cf
                          and isinstance(sf, list)
                          and isinstance(stc, dict)
                          and isinstance(stn, dict)
                      ):
                          collected_files = cf
                          selected_files = sf
                          selected_test_counts = stc
                          selected_test_names = stn
                      else:
                          collection_error = f"Invalid collection export in {inv_file}: missing or malformed keys"
                  elif isinstance(parsed, list) and parsed:
                      collected_files = parsed
                  else:
                      collection_error = f"Invalid collected inventory in {inv_file}: expected non-empty payload"
              except Exception as e:
                  collection_error = f"Failed to parse collection export {inv_file}: {e}"
          else:
              collection_error = f"Collection export not found at {inv_file}"

          meta = {
              "schema_version": 1,
              "shard": os.environ.get("SHARD", ""),
              "commit_sha": os.environ.get("GITHUB_SHA", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
              "pytest_outcome": os.environ.get("PYTEST_OUTCOME", ""),
              "collected_files": collected_files,
              "selected_files": selected_files,
              "selected_test_counts": selected_test_counts,
              "selected_test_names": selected_test_names,
          }
          if collection_error:
              meta["collection_error"] = collection_error
          (runner_temp / "pytest-meta.json").write_text(json.dumps(meta, indent=2) + "\n", encoding="utf-8")

          # When pytest succeeded, collection export failure must be visible and fail the step.
          # When pytest failed, sidecar and JUnit artifacts are preserved for diagnosis.
          if os.environ.get("PYTEST_OUTCOME") == "success" and collection_error:
              print(f"::error::{collection_error}")
              raise SystemExit(1)
          PY

      - name: Upload shard test report
        if: always() && steps.docs-check.outputs.docs_only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pytest-junit-${{ steps.shard-id.outputs.tag }}
          path: |
            ${{ runner.temp }}/pytest-report.xml
            ${{ runner.temp }}/pytest-meta.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Playwright mobile layout checks (shard 1 only)
        if: steps.docs-check.outputs.docs_only != 'true' && startsWith(matrix.shard, '1/')
        run: |
          ODYSSEUS_TEST_PYTHON=python ODYSSEUS_LAYOUT_BROWSER=chromium npx --no-install playwright test \
            --config tests/e2e/ios-layout.config.cjs \
            --reporter=line

  benchmark-gfm-security:
    name: Benchmark GFM rendering security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      # Test-only renderer, pinned independently of application requirements.
      - name: Install GitHub Flavored Markdown renderer
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: "cmarkgfm==2025.10.22"
      - name: Verify rendered benchmark report security
        run: python tests/test_audit_c5_benchmark_evidence.py --gfm
