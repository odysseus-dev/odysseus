name: PR Template Check

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  issues: write
  pull-requests: write

jobs:
  check-template:
    name: Validate PR body
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body and post feedback
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const prNumber = context.payload.pull_request.number;

            const issues = [];

            // ── 1. Summary section must be filled in ─────────────────────────────
            const summaryMatch = body.match(/##\s+Summary\s*\n([\s\S]*?)(?=\n#+\s|$)/i);
            const summaryText = (summaryMatch?.[1] ?? '').replace(/<!--[\s\S]*?-->/g, '').trim();
            if (!summaryText || summaryText.length < 20) {
              issues.push('**Summary** is missing or too short. Replace the placeholder with a real description of what changed and why.');
            }

            // ── 2. Linked issue must have a real number ───────────────────────────
            // Accept "Fixes #123", "Part of #123", "Closes #123", etc.
            if (!/(?:fixes|closes|part of|resolves)\s+#\d+/i.test(body)) {
              issues.push('**Linked Issue** is missing. Add `Fixes #NNN` (or `Part of #NNN`) with a real issue number. Every PR must be linked to an issue.');
            }

            // ── 3. At least one Type of Change box must be checked ───────────────
            const typeSection = body.match(/##\s+Type of Change[\s\S]*?(?=\n#+\s|$)/i)?.[0] ?? '';
            if (!/- \[x\]/i.test(typeSection)) {
              issues.push('**Type of Change** — check at least one box.');
            }

            // ── 4. Duplicate-search box must be checked ───────────────────────────
            if (!/- \[x\] I searched \[open issues\]/i.test(body)) {
              issues.push('**Checklist** — confirm you searched for duplicate issues and PRs by checking the first checklist item.');
            }

            // ── 5. Targets dev branch ─────────────────────────────────────────────
            const base = context.payload.pull_request.base.ref;
            if (base === 'main') {
              issues.push('**Target branch** — this PR targets `main`. All PRs should target `dev` instead. Please update the base branch.');
            }

            // ── 6. Test coverage box must be checked or reason given ──────────────
            const testChecked = /- \[x\] I have added or updated tests/i.test(body);
            const testExplained = (() => {
              const m = body.match(/If tests are not applicable.*?\n([\s\S]*?)(?=\n#+\s|$)/i);
              const explanation = (m?.[1] ?? '').replace(/<!--[\s\S]*?-->/g, '').trim();
              return explanation.length > 0;
            })();
            if (!testChecked && !testExplained) {
              issues.push('**Test coverage** — either check the "I have added or updated tests" box, or fill in the "If tests are not applicable, explain why" field. New code should have appropriate test coverage.');
            }

            // ── 7. "How to Test" section must be filled in ────────────────────────
            const howToTestMatch = body.match(/##\s+How to Test\s*\n([\s\S]*?)(?=\n#+\s|$)/i);
            const howToTestText = (howToTestMatch?.[1] ?? '').replace(/<!--[\s\S]*?-->/g, '').trim();
            // Must have at least one numbered step with real content beyond the bare "1." placeholder
            if (!howToTestText || !/\d+\.\s*\S/.test(howToTestText)) {
              issues.push('**How to Test** — provide step-by-step instructions a reviewer can follow. Do not leave this section empty.');
            }

            // ── Build comment ─────────────────────────────────────────────────────
            const COMMENT_MARKER = '<!-- pr-template-check-bot -->';

            const commentBody = issues.length === 0
              ? [
                  `${COMMENT_MARKER}`,
                  '✅ **PR template check passed.** All required sections are filled in.',
                ].join('\n')
              : [
                  `${COMMENT_MARKER}`,
                  '⚠️ **PR template check — action required**',
                  '',
                  'This PR is missing or has incomplete required sections. Please update the PR description to address the following:',
                  '',
                  `${issues.map(i => `- ${i}`).join('\n')}`,
                  '',
                  '---',
                  '*This comment updates automatically when you edit the PR description.*',
                ].join('\n');

            // Find an existing bot comment to update rather than posting a new one each time
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find(c => (c.body ?? '').includes(COMMENT_MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody,
              });
            }

            // ── Label management ─────────────────────────────────────────────────
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              } catch (e) {
                if (e.status !== 422) throw e;
              }
            }

            async function swapLabel(issueNum, add, remove) {
              await ensureLabel(add.name, add.color, add.description);
              await github.rest.issues.addLabels({ owner, repo, issue_number: issueNum, labels: [add.name] });
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNum, name: remove });
              } catch (e) {
                if (e.status !== 404 && e.status !== 410) throw e;
              }
            }

            if (issues.length === 0) {
              await swapLabel(
                prNumber,
                { name: 'ready for review', color: '0e8a16', description: 'Template complete — ready for maintainer triage' },
                'needs work'
              );
            } else {
              await swapLabel(
                prNumber,
                { name: 'needs work', color: 'd93f0b', description: 'PR template incomplete — action required before review' },
                'ready for review'
              );
            }

            // Fail the check so the PR shows a red status, but only for real blockers
            if (issues.length > 0) {
              core.setFailed(`PR template check failed: ${issues.length} issue(s) found. See the bot comment on the PR for details.`);
            }
