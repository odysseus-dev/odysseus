# Flat profile: no EQ by default, per-track ReplayGain, gapless playback.
# `ao=pipewire` is the Linux default used by the music service. Change it to
# `pulse` or `alsa` when the host does not run PipeWire.
vo=null
force-window=no
video=no
audio-display=no
ontop=no
keep-open=yes
osc=no
osd-level=0
ao=pipewire
gapless-audio=yes
audio-resample-filter-size=32
audio-resample-phase-shift=30
audio-swresample-o=resampler=soxr
replaygain=track
replaygain-preamp=0
replaygain-clip=yes
save-position-on-quit=no
input-media-keys=yes
# Optional MPRIS bridge. Install mpv-mpris, then uncomment the line below.
# script=/usr/lib/mpv-mpris/mpris.so
