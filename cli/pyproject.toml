[project]
name = "odysseus-cli"
version = "0.1.0"
description = "Local-first terminal coding agent powered by the Odysseus agent loop"
requires-python = ">=3.11"
# Core runtime deps are the Odysseus repo's own requirements (the CLI imports
# src.agent_loop). Install them with: pip install -r ../requirements.txt
# `textual` is only needed for the optional --tui full-screen mode.
dependencies = []

[project.optional-dependencies]
tui = ["textual>=0.80"]

[project.scripts]
odysseus = "odysseus_cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["odysseus_cli"]
