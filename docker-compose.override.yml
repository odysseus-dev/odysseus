# docker-compose.override.yml — LOCAL DEV ONLY (gitignored + dockerignored).
#
# Compose auto-merges this on top of docker-compose.yml for every
# `docker compose up`. It bind-mounts source over the baked-in image copy so
# code changes are live WITHOUT rebuilding the image.
#
#   Frontend (static/): save a file, then just refresh the browser.
#     The server sends `no-cache` on .js/.css/.html and the service worker is
#     network-first, so the edit is fetched fresh on reload. No rebuild, no
#     restart.
#
#   Python: still needs the process to restart to pick up changes. Either run
#     `docker compose restart odysseus`, or uncomment the `command:` below to
#     have uvicorn auto-reload on source changes.
#
# Delete this file (or `docker compose -f docker-compose.yml up`) to run the
# pure baked image exactly as in production.
services:
  odysseus:
    volumes:
      # Live frontend — the high-value one. Just refresh the browser.
      - ./static:/app/static:z

      # Optional: live Python source. Mounts the edited files over the image.
      # Changes still need a restart unless you also enable --reload below.
      - ./app.py:/app/app.py:z
      - ./routes:/app/routes:z
      - ./services:/app/services:z
      - ./core:/app/core:z

    # Optional: auto-restart uvicorn when Python source changes, so you never
    # have to `docker compose restart`. Requires watchfiles in the image
    # (uvicorn[standard]); if reload fails to start, remove this block and use
    # `docker compose restart odysseus` instead. The entrypoint is preserved.
    # command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "7000", "--reload", "--reload-dir", "/app"]
