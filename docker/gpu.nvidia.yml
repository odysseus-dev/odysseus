# NVIDIA GPU overlay. Enable by setting COMPOSE_FILE in .env:
#   COMPOSE_FILE=docker-compose.yml:docker/gpu.nvidia.yml
#
# Use scripts/check-docker-gpu.sh to diagnose GPU passthrough, optionally
# install the NVIDIA Container Toolkit (Ubuntu/Debian), and write COMPOSE_FILE
# to .env. The script is read-only by default — it installs nothing and never
# edits .env unless explicitly asked.
#
# Requires the NVIDIA Container Toolkit on the host.
#   Arch:    sudo pacman -S nvidia-container-toolkit
#   Debian:  sudo apt install nvidia-container-toolkit
#   Fedora:  sudo dnf install nvidia-container-toolkit
# Then:
#   sudo nvidia-ctk runtime configure --runtime=docker
#   sudo systemctl restart docker
# Verify with:
#   docker info | grep -i nvidia
#
# This overlay passes the host GPU through to the container. To also install
# CUDA build tooling for Cookbook's native llama.cpp build, set:
#   ODYSSEUS_LLAMA_CPP_CUDA=ON
# Use python:3.14-slim-bookworm for CUDA 12.4 or python:3.14-slim-trixie for
# CUDA 13.3, selected through ODYSSEUS_PYTHON_BASE in .env.
#   ODYSSEUS_PYTHON_BASE=python:3.14-slim-trixie
#   ODYSSEUS_LLAMA_CPP_CUDA_FLAVOR=cuda13-trixie
services:
  odysseus:
    build:
      context: .
      args:
        PYTHON_BASE: ${ODYSSEUS_PYTHON_BASE:-python:3.14-slim}
        ODYSSEUS_LLAMA_CPP_CUDA: ${ODYSSEUS_LLAMA_CPP_CUDA:-}
        ODYSSEUS_LLAMA_CPP_CUDA_FLAVOR: ${ODYSSEUS_LLAMA_CPP_CUDA_FLAVOR:-auto}
    environment:
      - ODYSSEUS_LLAMA_CPP_CUDA=${ODYSSEUS_LLAMA_CPP_CUDA:-}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
