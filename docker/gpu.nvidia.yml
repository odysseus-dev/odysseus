# NVIDIA GPU + in-stack Ollama overlay. Enable in .env:
#   COMPOSE_FILE=docker-compose.yml:docker/gpu.nvidia.yml
#
# Use scripts/check-docker-gpu.sh to diagnose GPU passthrough, optionally
# install the NVIDIA Container Toolkit (Ubuntu/Debian), and write COMPOSE_FILE
# to .env. The script is read-only by default — it installs nothing and never
# edits .env unless explicitly asked.
#
# Requires the NVIDIA Container Toolkit on the host.
#   Arch:    sudo pacman -S nvidia-container-toolkit
#   Debian:  sudo apt install nvidia-container-toolkit
#   Fedora:  sudo dnf install nvidia-container-toolkit
# Then:
#   sudo nvidia-ctk runtime configure --runtime=docker
#   sudo systemctl restart docker
# Verify with:
#   docker info | grep -i nvidia
#
# Starts Ollama in the stack with GPU access and points Odysseus at
# http://ollama:11434/v1 by default. Pull models after first boot, e.g.:
#   docker compose exec ollama ollama pull qwen2.5-coder:7b
#
# The odysseus GPU passthrough is for Cookbook serve engines (vLLM /
# llama-cpp-python). Ollama uses the standard CUDA-enabled image below.
services:
  odysseus:
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      - EMBEDDING_URL=${EMBEDDING_URL:-http://ollama:11434/v1/embeddings}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    depends_on:
      ollama:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama:
    image: docker.io/ollama/ollama
    ports:
      - "${OLLAMA_BIND:-127.0.0.1}:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-5m}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  ollama-data:
