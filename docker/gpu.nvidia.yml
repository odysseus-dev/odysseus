# NVIDIA GPU overlay. Enable by setting COMPOSE_FILE in .env:
#   COMPOSE_FILE=docker-compose.yml:docker/gpu.nvidia.yml
#
# Use scripts/check-docker-gpu.sh to diagnose GPU passthrough, optionally
# install the NVIDIA Container Toolkit (Ubuntu/Debian), and write COMPOSE_FILE
# to .env. The script is read-only by default — it installs nothing and never
# edits .env unless explicitly asked.
#
# Requires the NVIDIA Container Toolkit on the host.
#   Arch:    sudo pacman -S nvidia-container-toolkit
#   Debian:  sudo apt install nvidia-container-toolkit
#   Fedora:  sudo dnf install nvidia-container-toolkit
# Then:
#   sudo nvidia-ctk runtime configure --runtime=docker
#   sudo systemctl restart docker
# Verify with:
#   docker info | grep -i nvidia
#
# This overlay passes the host GPU through and switches Odysseus to the
# NVIDIA CUDA devel image. The host still needs the NVIDIA driver and
# NVIDIA Container Toolkit, but does not need a separate host CUDA toolkit
# for this Docker path; nvcc, CUDA headers, and runtime libraries are inside
# the image. Inference engines, including llama.cpp/llama-server, vLLM, and
# SGLang, are still installed/built through Cookbook when first used.
services:
  odysseus:
    build:
      context: .
      dockerfile: Dockerfile.nvidia
      args:
        INSTALL_OPTIONAL: ${INSTALL_OPTIONAL:-false}
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
