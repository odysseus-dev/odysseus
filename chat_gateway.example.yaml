# Odysseus Chat Gateway config.
# Copy to data/chat_gateway.yaml and edit. The gateway does nothing until
# `enabled: true` AND at least one platform is enabled.

enabled: false

# Which Odysseus user the agent acts as: owns the sessions, model endpoints,
# memory, and tools the gateway agent uses. Must be an existing Odysseus user.
owner: your-odysseus-username

platforms:
  mattermost:
    enabled: false
    base_url: https://mattermost.example.com
    token: ${MATTERMOST_BOT_TOKEN}     # bot account access token (env-expanded)
    verify_tls: true                   # set false only for self-signed certs
    require_mention: true              # in channels, only respond when @mentioned (DMs always answered)
    channels: []                       # [] = any channel the bot is in; or list channel IDs to restrict
    free_response_channels: []         # channel IDs that reply WITHOUT a mention (interactive channels)
    # model: ""                        # optional: pin a model; default = owner's first enabled endpoint
    toolsets:
      mode: all                        # all | allow | deny
      allow: []                        # when mode=allow: bias the agent toward these tools
      deny: []                         # when mode=deny: block these (e.g. ["terminal","code_execution"])

  # ── Matrix (self-hosted Synapse/Dendrite/Conduit) ──
  matrix:
    enabled: false
    base_url: https://matrix.example.com     # homeserver base URL
    token: ${MATRIX_ACCESS_TOKEN}            # bot user access token
    verify_tls: true
    auto_join: true                          # join rooms when the bot is invited
    require_mention: true                    # @mention in rooms; DMs always answered
    channels: []                             # [] = any joined room; or list room IDs
    toolsets:
      mode: all

  # ── IRC (self-hosted ergo/InspIRCd) ──
  irc:
    enabled: false
    host: irc.example.com
    port: 6697
    tls: true
    verify_tls: true
    nick: odysseus
    # password: ${IRC_SERVER_PASSWORD}        # optional PASS
    # nickserv_password: ${IRC_NICKSERV_PASSWORD}  # optional NickServ IDENTIFY
    require_mention: true                      # "nick: msg" in channels; DMs always answered
    channels: ["#odysseus"]                    # channels to join
    toolsets:
      mode: all

  # ── SimpleX Chat (privacy-first; drives a local simplex-chat CLI) ──
  # Run the CLI as a websocket server first:  simplex-chat -p 5225
  simplex:
    enabled: false
    ws_url: ws://127.0.0.1:5225      # the simplex-chat CLI websocket
    auto_accept: true                # auto-accept incoming contact requests
    require_mention: true            # groups need a mention; direct chats always answered
    toolsets:
      mode: all

  # Third-party / cloud platforms (Telegram, Discord, Slack, Teams, WhatsApp,
  # Signal, ...) are not self-hosted; copy adapters/_skeleton.py to add one.
  # telegram:
  #   enabled: false
  #   token: ${TELEGRAM_BOT_TOKEN}
  #   require_mention: false
