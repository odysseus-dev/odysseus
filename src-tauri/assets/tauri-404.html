<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odysseus — Backend Offline</title>
</head>
<body>
  <div class="not-found-shell">
    <div class="not-found-card">
      <div class="badge">Backend unavailable</div>
      <h1>Connection lost</h1>

      <p class="lead">
        The Odysseus backend could not be reached. This usually means the server is not running,
        or it was not installed correctly.
      </p>

      <div class="hint-box">
        <strong>Possible causes:</strong> the backend service is stopped, the install did not finish,
        or the app is trying to reach the wrong local endpoint.
      </div>

      <div class="actions">
        <button class="primary-action" type="button">Retry</button>
        <button type="button">Check setup</button>
      </div>
    </div>
  </div>
</body>
</html>
